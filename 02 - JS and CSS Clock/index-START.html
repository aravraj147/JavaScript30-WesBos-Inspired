<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JS + CSS Clock</title>
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body>
    <div class="clock">
      <div class="clock-face">
        <div class="hand hour-hand"></div>
        <div class="hand min-hand"></div>
        <div class="hand second-hand"></div>
      </div>
    </div>
    <div class="display"></div>

    <style>
      html {
        background: #018ded url(https://unsplash.it/1500/1000?image=881&blur=5);
        background-size: cover;
        font-family: sans-serif;
        text-align: center;
        font-size: 10px;
      }

      body {
        margin: 0;
        font-size: 2rem;
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 100vh;
        align-items: center;
      }

      .clock {
        width: 30rem;
        height: 30rem;
        border: 20px solid white;
        border-radius: 50%;
        margin: 50px auto;
        position: relative;
        padding: 2rem;
        box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.1), inset 0 0 0 3px #efefef,
          inset 0 0 10px black, 0 0 10px rgba(0, 0, 0, 0.2);
      }

      .clock-face {
        position: relative;
        width: 100%;
        height: 100%;
        transform: translateY(-3px);
      }

      .hand {
        width: 50%;
        height: 6px;
        background: black;
        position: absolute;
        top: 50%;
        transform-origin: 100%;
        transform: rotate(90deg);
        transition: 0.05s;
      }
      .display {
        flex-direction: column;
        width: 20%;
        background: white;
        padding: 5px;
        line-height: 35px;
        border-radius: 15px solid black;
      }
    </style>

    <script>
      const sech = document.querySelector(".second-hand");
      const minh = document.querySelector(".min-hand");
      const hrh = document.querySelector(".hour-hand");
      const d = document.querySelector(".display");

      function convertDate(rt) {
        const [h, t, s] = rt.split(":").map(Number);

        const z = h >= 12 ? "PM" : "AM";
        const newh = h % 12 || 12;
        const newt = t < 10 ? "0" + t : t;
        const news = s < 10 ? "0" + s : s;
        const it = `${newh}:${newt}:${news} ${z}`;
        return it;
      }
      function setDate() {
        const now = new Date();
        const sec = now.getSeconds();
        const secdeg = (sec / 60) * 360 + 90;

        sech.style.transform = `rotate(${secdeg}deg)`;

        const min = now.getMinutes();
        const mindeg = (min / 60) * 360 + 90;

        minh.style.transform = `rotate(${mindeg}deg)`;

        const hr = now.getHours();
        const hrdeg = (hr / 12) * 360 + 90;

        hrh.style.transform = `rotate(${hrdeg}deg)`;
        const zz = hr > 12 ? "PM" : "AM";

        const rt = hr + ":" + min + ":" + sec;
        d.innerHTML = `StandardTime :${rt} ${zz}<br> Indian Time : ${convertDate(
          rt
        )}`;
      }
      setInterval(setDate, 1000);
    </script>
  </body>
</html>
